[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zen-lang"
version = "0.2.4"
description = "ZEN: A minimal programming language built from scratch for AI."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Abdullah Khan Suri" }
]
requires-python = ">=3.10"
dependencies = []
keywords = ["programming-language", "ai", "autograd", "neural-networks", "interpreter", "vm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow", "reportlab", "build"]

[project.urls]
Repository = "https://github.com/abdulakhan9132/zen-lang"

[project.scripts]
zen = "zen.cli:main"

[tool.setuptools.packages.find]
include = ["zen*"]

[tool.setuptools.package-data]
zen = [
    "stdlib/ai/*.zen",
    "stdlib/zennum/*.zen",
    "stdlib/zennet/*.zen",
    "native/*.c",
    "native/*.so",
    "native/*.dll",
    "native/*.dylib",
    "native/*.pyd",
    "docs/Learn-ZEN.pdf",
    "docs/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: marks slow training tests (run with 'pytest -m slow')",
]
